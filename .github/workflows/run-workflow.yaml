name: Run Checks

on:
  - push
  - pull_request
  - fork

jobs:
  run-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v3

      - name: Validate Composer Files
        run: composer validate --strict

      - name: Run composer install
        uses: php-actions/composer@v6
        with:
          php_version: 8.0
          php_extensions: pdo_sqlite sqlite3 mbstring mysqli gd zip curl dom xml

      - name: Run linter
        run: composer lint
