namespace: Tests
support_namespace: Support
paths:
  tests: tests
  output: tests/_output
  data: tests/Support/Data
  support: tests/Support
  envs: tests/_envs
actor_suffix: Tester
params:
  - tests/.env
coverage:
  enabled: true
  include:
    - plugin.php
    - src/*
  exclude:
    # Vendored third-party code, built assets and the tests themselves.
    - vendor/*
    - node_modules/*
    - tests/*
    - assets/*
    - dist/*
    - languages/*
extensions:
  enabled:
    - Codeception\Extension\RunFailed
    - Codeception\Extension\Recorder
    - lucatume\WPBrowser\Extension\ChromeDriverController
    - lucatume\WPBrowser\Extension\BuiltInServerController
    - lucatume\WPBrowser\Extension\Symlinker
  config:
    Codeception\Extension\Recorder:
      # Codeception keys modules by the exact string the suite enables them under, so
      # the short name `WPWebDriver` never resolves here and the Recorder silently
      # disables itself.
      module: lucatume\WPBrowser\Module\WPWebDriver
      delete_successful: true
      animate_slides: true
    lucatume\WPBrowser\Extension\ChromeDriverController:
      # Only the browser suite needs a driver. Without this the extension starts for
      # every suite, which makes Integration and Harness depend on Chrome for nothing.
      suites: [Tests.EndToEnd]
      port: "%CHROMEDRIVER_PORT%"
    lucatume\WPBrowser\Extension\BuiltInServerController:
      # Integration and Harness load WordPress in process and open no sockets, so only
      # the browser suite needs a server in front of the install.
      suites: [Tests.EndToEnd]
      # One worker serves one connection at a time, and a browser opens several per
      # host. At 5 workers the server stops answering a few tests in.
      workers: 24
      port: "%BUILTIN_SERVER_PORT%"
      docroot: "%WORDPRESS_ROOT_DIR%"
      env:
        DATABASE_TYPE: sqlite
        DB_ENGINE: sqlite
        DB_DIR: "%codecept_root_dir%/tests/_wordpress/data"
        DB_FILE: db.sqlite
        WORDPRESS_URL: "%WORDPRESS_URL%"
        # What Paytrail is told to call back on, used only by
        # tests/_mu-plugins/02-paytrail-public-url.php.
        PAYTRAIL_WORDPRESS_URL: "%PAYTRAIL_WORDPRESS_URL%"
        BUILTIN_SERVER_PORT: "%BUILTIN_SERVER_PORT%"
        WORDPRESS_ADMIN_PASSWORD: "%WORDPRESS_ADMIN_PASSWORD%"
    lucatume\WPBrowser\Extension\Symlinker:
      wpRootFolder: "%WORDPRESS_ROOT_DIR%"
      plugins:
        - .
        - tests/_plugins/woocommerce
      themes:
        - tests/_themes/storefront
  commands:
    - lucatume\WPBrowser\Command\RunOriginal
    - lucatume\WPBrowser\Command\RunAll
    - lucatume\WPBrowser\Command\GenerateWPUnit
    - lucatume\WPBrowser\Command\DbExport
    - lucatume\WPBrowser\Command\DbImport
    - lucatume\WPBrowser\Command\MonkeyCachePath
    - lucatume\WPBrowser\Command\MonkeyCacheClear
    - lucatume\WPBrowser\Command\DevStart
    - lucatume\WPBrowser\Command\DevStop
    - lucatume\WPBrowser\Command\DevInfo
    - lucatume\WPBrowser\Command\DevRestart
    - lucatume\WPBrowser\Command\ChromedriverUpdate
